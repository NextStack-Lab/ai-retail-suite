services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-retail-postgres
    environment:
      POSTGRES_DB: ai_retail_suite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_retail_suite"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ai-retail-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ai_retail_suite
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-productionSecretKeyMustBeAtLeast256BitsLongForSecurity!!}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
