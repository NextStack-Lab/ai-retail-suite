# Datasource - integration tests (URL set dynamically by Testcontainers)
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# App - JWT
app.jwt.secret=testSecretKeyForIntegrationTestsMustBeAtLeast256BitsLong!!
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# App - CORS
app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# App - Mail
app.mail.from=test@airetail.com
app.mail.reset-password-url=http://localhost:3000/reset-password

# Logging
logging.level.com.nextstack.airetail=INFO
logging.level.org.hibernate.SQL=WARN
